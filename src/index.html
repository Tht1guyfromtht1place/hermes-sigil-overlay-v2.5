<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" />
  <title>Hermes Sigil Overlay</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <div id="ambientHalo"></div>
    <div id="ringSweep" class="animated"></div>
    <img class="sigilContrast contrastDark" src="../assets/hermes-sigil.png" draggable="false" aria-hidden="true" />
    <img class="sigilContrast contrastLight" src="../assets/hermes-sigil.png" draggable="false" aria-hidden="true" />
    <img id="sigil" src="../assets/hermes-sigil.png" draggable="false" alt="" aria-hidden="true" />
    <img id="hermesWordRing" src="../assets/hermes-sigil.png" draggable="false" aria-hidden="true" />
    <img id="waveformRing" src="../assets/hermes-sigil.png" draggable="false" aria-hidden="true" />
    <img id="hermesForeground" src="../assets/hermes-sigil.png" draggable="false" aria-hidden="true" />
    <div id="connectionOrb" aria-hidden="true"></div>
    <div id="resonanceField" aria-hidden="true">
      <div class="resonanceRing ringOuter"></div>
      <div class="resonanceRing ringMiddle"></div>
      <div class="resonanceRing ringInner"></div>
    </div>
    <div id="pathLayer"></div>
    <div id="coreGlow" class="animated"></div>
    <div id="indicatorLayer"></div>
    <div id="guideLayer"></div>
    <div id="status" role="status" aria-live="polite"></div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
